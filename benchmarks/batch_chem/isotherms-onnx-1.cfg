[simulation]
description = "Test input file for batch chem ONNX engine driver, Model 1."
timestep = 864000 # 10 days
max_steps = 100

[state]
density = 11.111       # Unmapped routing noise.
porosity = 0.222       # Unmapped routing noise.
temperature = 333.333  # Unmapped routing noise.
pressure = 444.444     # Unmapped routing noise.

# double_input_1[0] represents uranium_total. For this lifecycle benchmark,
# surface_site_density is only a carrier for the LSURF training value.
# Its config feature retains the leading '[' produced by GetIndexLabel().
surface_site_density[uranium_total] = -6.677780705266080

# This value is routing noise, not an ONNX input. The current batch driver uses
# the ion-exchange index while initializing surface-site values, so the matching
# entry makes surface_site_density[uranium_total] available at index 0.
cation_exchange_capacity[uranium_total] = 555.555

[material]
volume = 1.0
saturation = 1.0

[chemistry]
engine = ONNX
input_file = ../../models/lsurf_model_1_float_64.json
initial_condition = initial

[output]
verbose = true
type = gnuplot
filename = isotherms-onnx-1.out
