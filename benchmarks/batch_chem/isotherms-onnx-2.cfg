[simulation]
description = "Test input file for batch chem ONNX engine driver, Model 2."
timestep = 864000 # 10 days
max_steps = 1

[state]
density = 11.111       # Unmapped routing noise.
porosity = 0.222       # Unmapped routing noise.
temperature = 333.333  # Unmapped routing noise.

# double_input_2[0] represents uranium_total. For this lifecycle benchmark,
# cation_exchange_capacity is only a carrier for the LSURF training value.
# Its manifest feature retains the leading '[' produced by GetIndexLabel().
cation_exchange_capacity[uranium_total] = -6.677780705266080

# double_input_2[1] represents U_species14. Aqueous pressure is only a carrier
# here because the batch driver permits the negative LSURF training value.
pressure = -37.488999999999997

[material]
volume = 1.0
saturation = 1.0

[chemistry]
engine = ONNX
input_file = ../../models/lsurf_model_2_float_64.json
initial_condition = initial

[output]
verbose = true
type = gnuplot
filename = isotherms-onnx-2.out
